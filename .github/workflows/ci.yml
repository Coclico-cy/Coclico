name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Coclico.slnx

      - name: Build (Release)
        run: dotnet build Coclico.slnx -c Release --no-restore

      - name: Format check (non bloquant)
        run: dotnet format Coclico.slnx --verify-no-changes || echo "::warning::dotnet format a détecté des changements de formatage (non bloquant)"

      - name: Test
        run: dotnet test Coclico.slnx -c Release --no-build --logger trx

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore