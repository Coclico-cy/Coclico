name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Coclico.slnx

      - name: Build (Release)
        run: dotnet build Coclico.slnx -c Release --no-restore

      # Le format check est bloquant : un `exit 0` forcé rendait cette étape
      # purement cosmétique (elle ne pouvait jamais échouer), ce qui masquait
      # les dérives de formatage. Elle fait maintenant échouer la CI le cas échéant.
      - name: Format check
        run: dotnet format Coclico.slnx --verify-no-changes

      - name: Test
        run: >
          dotnet test Coclico.slnx -c Release --no-build --logger trx
          --collect:"XPlat Code Coverage"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      - name: Publish coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: '**/coverage.cobertura.xml'
          if-no-files-found: ignore
