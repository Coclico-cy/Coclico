name: "Étiquetage des pull requests"

on:
  pull_request_target:
    types: [ opened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "Appliquer les labels"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          sync-labels: true
