name: "Étiquetage des pull requests"

on:
  pull_request_target:
    types: [ opened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "Appliquer les labels"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true