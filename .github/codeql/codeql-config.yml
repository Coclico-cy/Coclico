name: "Configuration CodeQL - Coclico"

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
- exclude:
    id: cs/call-to-unmanaged-code
- exclude:
    id: cs/unmanaged-code

paths:
  - Coclico
  - Coclico.InstallerAot
  - Coclico.Tests

paths-ignore:
  - docs
  - installer
  - "**/*.md"
  - "**/obj/**"
  - "**/bin/**"
